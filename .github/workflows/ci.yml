name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install ruff==0.6.9
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore model artifact (cache)
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: artifacts/bacteria_models.joblib
          key: bacteria-models-v1
          lookup-only: true
      - name: Download model artifact (release)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: gh release download model-artifact --clobber || true
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify model artifact
        run: |
          test -f artifacts/bacteria_models.joblib || {
            echo "::error::Trained model artifact missing. Seed it from a machine with the dataset: make ci-upload-artifact (see CONTRIBUTING.md)."
            exit 1
          }
      - name: Run tests
        run: python -m pytest -q
